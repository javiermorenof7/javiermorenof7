<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" role="img" aria-labelledby="t d" font-family="'Avenir Next', 'Segoe UI Variable Display', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"><title id="t">Flujo de SIVIGILA</title><desc id="d">780 910 filas en bronce, 768 918 en plata</desc><text x="0.0" y="22.0" font-size="18" font-weight="700" fill="#E6EDF3" text-anchor="start">Salud pública: 780 910 filas reales de bronce a plata</text><text x="0.0" y="44.0" font-size="13" font-weight="400" fill="#9BA7B4" text-anchor="start">SIVIGILA (Instituto Nacional de Salud) 2017-2019 y 2021, cruzado con el DIVIPOLA del DANE.</text><text x="0.0" y="80.0" font-size="13" font-weight="600" fill="#E6EDF3" text-anchor="start">Bronce</text><rect x="0.0" y="88.0" width="600.0" height="16" rx="3" fill="#4F5A70"/><text x="610.0" y="101.0" font-size="13" font-weight="700" fill="#E6EDF3" text-anchor="start">780 910</text><text x="0.0" y="126.0" font-size="13" font-weight="600" fill="#E6EDF3" text-anchor="start">Plata</text><rect x="0.0" y="134.0" width="590.8" height="16" rx="3" fill="#8AB4FF"/><text x="610.0" y="147.0" font-size="13" font-weight="700" fill="#E6EDF3" text-anchor="start">768 918 (98,5 %)</text><text x="0.0" y="190.0" font-size="13" font-weight="600" fill="#E6EDF3" text-anchor="start">Apartadas con su motivo: 11 992 (escala propia)</text><text x="0.0" y="223.0" font-size="12" font-weight="400" fill="#E6EDF3" text-anchor="start">Caso del exterior</text><rect x="300.0" y="212.0" width="300.0" height="12" rx="3" fill="#C75A26"/><text x="608.0" y="223.0" font-size="12" font-weight="700" fill="#E6EDF3" text-anchor="start">5 918</text><text x="0.0" y="245.0" font-size="12" font-weight="400" fill="#E6EDF3" text-anchor="start">Municipio desconocido</text><rect x="300.0" y="234.0" width="288.5" height="12" rx="3" fill="#C75A26"/><text x="596.5" y="245.0" font-size="12" font-weight="700" fill="#E6EDF3" text-anchor="start">5 691</text><text x="0.0" y="267.0" font-size="12" font-weight="400" fill="#E6EDF3" text-anchor="start">Procedencia desconocida</text><rect x="300.0" y="256.0" width="13.0" height="12" rx="3" fill="#C75A26"/><text x="321.0" y="267.0" font-size="12" font-weight="700" fill="#E6EDF3" text-anchor="start">256</text><text x="0.0" y="289.0" font-size="12" font-weight="400" fill="#E6EDF3" text-anchor="start">Código de municipio inexistente</text><rect x="300.0" y="278.0" width="6.0" height="12" rx="3" fill="#C75A26"/><text x="314.0" y="289.0" font-size="12" font-weight="700" fill="#E6EDF3" text-anchor="start">119</text><text x="0.0" y="311.0" font-size="12" font-weight="400" fill="#E6EDF3" text-anchor="start">Municipio sin código en DIVIPOLA</text><rect x="300.0" y="300.0" width="1.5" height="12" rx="3" fill="#C75A26"/><text x="308.4" y="311.0" font-size="12" font-weight="700" fill="#E6EDF3" text-anchor="start">8</text></svg>
