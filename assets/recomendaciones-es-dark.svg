<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320" role="img" aria-labelledby="t d" font-family="'Avenir Next', 'Segoe UI Variable Display', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"><title id="t">Recomendaciones</title><desc id="d">Casa de muñecas: baño → sala: 87,6 %, Taza de peras → taza de manzanas: 75,2 %, Estrella de madera → corazón: 70,6 %, Árbol de cuadros → estrella: 70,4 %, Libreta amarilla → libreta roja: 65,8 %</desc><text x="0.0" y="22.0" font-size="18" font-weight="700" fill="#E6EDF3" text-anchor="start">Qué recomendar: confianza P(B|A) en canastas reales</text><text x="0.0" y="44.0" font-size="13" font-weight="400" fill="#9BA7B4" text-anchor="start">39 516 facturas: quien compra un producto de una colección se lleva el otro en 2 de cada 3 o más.</text><text x="0.0" y="76.0" font-size="13" font-weight="400" fill="#E6EDF3" text-anchor="start">Casa de muñecas: baño → sala</text><rect x="0.0" y="84.0" width="690.0" height="14" rx="3" fill="#8AB4FF"/><text x="698.0" y="96.0" font-size="13" font-weight="700" fill="#E6EDF3" text-anchor="start">87,6 %</text><text x="0.0" y="122.0" font-size="13" font-weight="400" fill="#E6EDF3" text-anchor="start">Taza de peras → taza de manzanas</text><rect x="0.0" y="130.0" width="593.0" height="14" rx="3" fill="#8AB4FF"/><text x="601.0" y="142.0" font-size="13" font-weight="700" fill="#E6EDF3" text-anchor="start">75,2 %</text><text x="0.0" y="168.0" font-size="13" font-weight="400" fill="#E6EDF3" text-anchor="start">Estrella de madera → corazón</text><rect x="0.0" y="176.0" width="556.5" height="14" rx="3" fill="#8AB4FF"/><text x="564.5" y="188.0" font-size="13" font-weight="700" fill="#E6EDF3" text-anchor="start">70,6 %</text><text x="0.0" y="214.0" font-size="13" font-weight="400" fill="#E6EDF3" text-anchor="start">Árbol de cuadros → estrella</text><rect x="0.0" y="222.0" width="554.7" height="14" rx="3" fill="#8AB4FF"/><text x="562.7" y="234.0" font-size="13" font-weight="700" fill="#E6EDF3" text-anchor="start">70,4 %</text><text x="0.0" y="260.0" font-size="13" font-weight="400" fill="#E6EDF3" text-anchor="start">Libreta amarilla → libreta roja</text><rect x="0.0" y="268.0" width="518.8" height="14" rx="3" fill="#8AB4FF"/><text x="526.8" y="280.0" font-size="13" font-weight="700" fill="#E6EDF3" text-anchor="start">65,8 %</text><text x="0.0" y="310.0" font-size="12" font-weight="400" fill="#9BA7B4" text-anchor="start">Fuente: Online Retail II, UCI Machine Learning Repository (CC BY 4.0).</text></svg>
