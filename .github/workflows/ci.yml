name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python syntax
        run: git ls-files '*.py' | xargs python -m py_compile
      - name: Valid notebooks
        run: git ls-files '*.ipynb' | xargs -I{} python -c "import json, sys; json.load(open(sys.argv[1], encoding='utf-8'))" {}
