# Databricks Asset Bundle: despliega los tres notebooks como un job.
# Al no declarar clúster, las tareas corren en cómputo serverless.
bundle:
  name: calendarios_aulaviva

resources:
  jobs:
    calendarios:
      name: calendarios_${bundle.target}
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: America/Bogota
      tasks:
        - task_key: bronze
          notebook_task:
            notebook_path: ./notebooks/bronze.py
            base_parameters:
              entorno: ${bundle.target}
        - task_key: silver
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: ./notebooks/silver.py
            base_parameters:
              entorno: ${bundle.target}
        - task_key: gold
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ./notebooks/gold.py
            base_parameters:
              entorno: ${bundle.target}

# El nombre del target es el entorno: decide el catálogo y el bucket que usan los notebooks
targets:
  dev:
    mode: development
    default: true
  prod: {}
